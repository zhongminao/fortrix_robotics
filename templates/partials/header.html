{% load static %}
{% url 'home' as home_url %}
{% url 'product' as product_url %}
<header class="site-header{% if request.path == product_url %} site-header--product{% endif %}" id="siteHeader">
    <div class="site-header__inner">
        <a class="site-header__logo" href="{{ home_url }}" aria-label="Fortrix Robotics Home">
            <img
                class="site-header__logo-image"
                src="{% if request.path == product_url %}{% static 'images/branding/logo_dark_ch.png' %}{% else %}{% static 'images/branding/logo_light_ch.png' %}{% endif %}"
                alt="Fortrix Robotics"
            >
        </a>

        <nav class="site-header__nav" aria-label="Primary">
            <a class="site-header__item" href="{{ product_url }}">产品介绍</a>
            <span class="site-header__item site-header__item--static">一脑多体架构</span>
            <span class="site-header__item site-header__item--static">产品矩阵</span>
            <span class="site-header__item site-header__item--static">应用场景</span>
            <span class="site-header__item site-header__item--static">联系我们</span>
        </nav>
    </div>
</header>
