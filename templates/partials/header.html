{% load static %}
{% url 'home' as home_url %}
{% url 'product' as product_url %}
<header class="site-header{% if request.path == product_url %} site-header--product site-header--solid{% endif %}" id="siteHeader">
    <div class="site-header__inner">
        <a class="site-header__logo" href="{{ home_url }}" aria-label="Fortrix Robotics Home">
            <img
                class="site-header__logo-image"
                src="{% if request.path == product_url %}{% static 'images/branding/logo_dark_ch.png' %}{% else %}{% static 'images/branding/logo_light_ch.png' %}{% endif %}"
                alt="Fortrix Robotics"
            >
        </a>

        <nav class="site-header__nav" aria-label="Primary">
            {% if request.path == product_url %}
            <a class="site-header__item" href="#product-profile">Robosweeper P1</a>
            <a class="site-header__item" href="#product-advantages">核心竞争力</a>
            <a class="site-header__item" href="#product-scenes">应用场景</a>
            <a class="site-header__item" href="#product-specs">技术参数</a>
            <a class="site-header__item" href="#product-technology">核心技术</a>
            {% else %}
            <a class="site-header__item" href="{{ product_url }}">产品介绍</a>
            <a class="site-header__item" href="{{ home_url }}#technology">一脑多体架构</a>
            <a class="site-header__item" href="{{ home_url }}#about">产品矩阵</a>
            <a class="site-header__item" href="{{ product_url }}#product-scenes">应用场景</a>
            <a class="site-header__item" href="{{ product_url }}#contact">联系我们</a>
            {% endif %}
        </nav>
    </div>
</header>
