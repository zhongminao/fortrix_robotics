{% load static %}
{% url 'home' as home_url %}
{% url 'product' as product_url %}
{% url 'about' as about_url %}

<header class="site-header{% if request.path == home_url or request.path == about_url %} site-header--overlay{% endif %}" id="siteHeader">
    <div class="site-header__inner">
        <a class="site-header__logo" href="{{ home_url }}" aria-label="Fortrix Robotics Home">
            <img
                class="site-header__logo-image"
                src="{% static 'images/branding/logo_dark_ch.png' %}"
                alt="Fortrix Robotics"
            >
        </a>

        <nav class="site-header__nav" aria-label="Primary">
            <a class="site-header__item" href="{{ product_url }}">产品矩阵</a>
            <span class="site-header__item site-header__item--static">一脑多体架构</span>
            <a class="site-header__item" href="{{ about_url }}">关于我们</a>
            <span class="site-header__item site-header__item--static">加入我们</span>
        </nav>
    </div>
</header>
